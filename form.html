<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tlatōntli tlaxōchia (Florece la Furia)</title>
    <link rel="icon" href="img/TransNB.png" type="image/png">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="formulario-compacto-body"></body>

    <div id="places" class="seccion-formulario">
        <form action="https://usebasin.com/f/2de84737489c" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_subject" value="[UnderTrans] Nuevo Lugar - por {name}" />
            <fieldset>
                <section id="Personal-lugar">
                    <h3>Información Personal (Opcional)</h3>
                    <label for="name-lugar">Nombre</label>
                    <input type="text" id="name-lugar" name="name" placeholder="Escribe tu nombre elegido" required class="campo">
                    <div class="campo-group">
                        <div>
                            <label for="gender-lugar">Género</label>
                            <input type="text" id="gender-lugar" name="gender" placeholder="Género con el que te identificas" required class="campo">
                        </div>
                    </div>
                </section>

                <section id="contact-lugar">
                    <h3>Contacto y Redes del Lugar</h3>
                    <div class="campo-group">
                        <div>
                            <label for="telefono-lugar">Número teléfono</label>
                            <input type="number" id="telefono-lugar" name="telefono" placeholder="55000000000" required class="campo">
                        </div>
                        <div>
                            <label for="email-lugar">Correo</label>
                            <input type="email" id="email-lugar" name="email" placeholder="tucorreo@ejemplo.com" required class="campo">
                        </div>
                    </div>
                                    <div class="redes-sociales">
                    <input type="checkbox" id="check-instagram" name="usa_instagram">
                    <input type="checkbox" id="check-tiktok" name="usa_tiktok">
                    <input type="checkbox" id="check-web" name="usa_web">
                    <input type="checkbox" id="check-facebook" name="usa_facebook">
                    <div class="redes-iconos">
                        <label for="check-instagram" class="red-label"><img src="img/1.png" alt="Instagram"></label>
                        <label for="check-tiktok" class="red-label"><img src="img/2.png" alt="TikTok"></label>
                        <label for="check-web" class="red-label">
                            <svg viewBox="0 0 24 24" class="icono-web"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
                        </label>
                        <label for="check-facebook" class="red-label"><img src="img/3.png" alt="Facebook"></label>
                    </div>
                    <div class="redes-inputs">
                        <input type="url" class="input-red-social input-instagram" name="link_instagram" placeholder="Tu link de Instagram">
                        <input type="url" class="input-red-social input-tiktok" name="link_tiktok" placeholder="Tu link de TikTok">
                        <input type="url" class="input-red-social input-web" name="link_web" placeholder="Tu página web">
                        <input type="url" class="input-red-social input-facebook" name="link_facebook" placeholder="Tu link de Facebook">
                    </div>
                </div>
                </section>
                <section id="Ficha-lugar">
                    <h3>Ficha del espacio</h3>
                    <label for="nombre-espacio">Nombre del lugar</label>
                    <input type="text" id="nombre-espacio" name="nombre_lugar" placeholder="Nombre del espacio" required class="campo">
                    
                    <label for="direccion-espacio">Dirección o Referencia</label>
                    <input type="text" id="direccion-espacio" name="direccion" placeholder="Calle, alcaldía o referencias" required class="campo">

                    <label for="descripcion-espacio">Descripción del espacio</label>
                    <textarea id="descripcion-espacio" name="descripcion_lugar" class="campo" placeholder="¿Qué hace a este lugar trans-incluyente o seguro?"></textarea>
                </section>

            </fieldset>
            <button type="submit" class="boton-enviar">ENVIAR</button>
        </form>
    </div>

    <div id="eve" class="seccion-formulario">
        <form action="https://usebasin.com/f/2de84737489c" method="POST" enctype="multipart/form-data">
        <fieldset>
            <section id="Personal">
                <h3>Información Persona (Opcional)</h3>
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" placeholder="Escribe tu nombre elegido" required class="campo">
                <div class="campo-group">
                    <div>
                        <label for="gender">Género</label>
                        <input type="text" id="gender" name="gender" placeholder="Género con el que te identificas" required class="campo">
                    </div>
                </div>
            </section>

            <section id="contact">
                <h3>Link de los perfiles de la empresa que organiza el evento</h3>
                <div class="campo-group">
                    <div>
                        <label for="telefono">Número teléfono</label>
                        <input type="number" id="telefono" name="telefono" placeholder="55000000000" required class="campo">
                    </div>
                    <div>
                        <label for="email">Correo</label>
                        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required class="campo">
                    </div>
                </div>
                <div class="redes-sociales">
                    <input type="checkbox" id="check-instagram" name="usa_instagram">
                    <input type="checkbox" id="check-tiktok" name="usa_tiktok">
                    <input type="checkbox" id="check-web" name="usa_web">
                    <input type="checkbox" id="check-facebook" name="usa_facebook">
                    <div class="redes-iconos">
                        <label for="check-instagram" class="red-label"><img src="img/1.png" alt="Instagram"></label>
                        <label for="check-tiktok" class="red-label"><img src="img/2.png" alt="TikTok"></label>
                        <label for="check-web" class="red-label">
                            <svg viewBox="0 0 24 24" class="icono-web"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
                        </label>
                        <label for="check-facebook" class="red-label"><img src="img/3.png" alt="Facebook"></label>
                    </div>
                    <div class="redes-inputs">
                        <input type="url" class="input-red-social input-instagram" name="link_instagram" placeholder="Tu link de Instagram">
                        <input type="url" class="input-red-social input-tiktok" name="link_tiktok" placeholder="Tu link de TikTok">
                        <input type="url" class="input-red-social input-web" name="link_web" placeholder="Tu página web">
                        <input type="url" class="input-red-social input-facebook" name="link_facebook" placeholder="Tu link de Facebook">
                    </div>
                </div>
            </section>

            <section id="Ficha">
                <h3>Ficha del evento</h3>
                <label for="event">Nombre del evento</label>
                <input type="text" id="event" name="nombre_evento" placeholder="Nombre de tu evento" required class="campo">
                <div class="campo-group">
                    <div>
                        <label for="fecha-inicio">Fecha de inicio</label>
                        <input type="date" id="fecha-inicio" name="fecha_inicio" required class="campo">
                    </div>
                    <div>
                        <label for="hora-inicio">Hora de inicio</label>
                        <input type="time" id="hora-inicio" name="hora_inicio" required class="campo">
                    </div>
                </div>
                <div class="campo-group">
                    <div>
                        <label for="fecha-fin">Fecha de término</label>
                        <input type="date" id="fecha-fin" name="fecha_fin" required class="campo">
                    </div>
                    <div>
                        <label for="hora-fin">Hora de término</label>
                        <input type="time" id="hora-fin" name="hora_fin" required class="campo">
                    </div>
                </div>
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion_evento" class="campo" placeholder="Detalla el evento"></textarea>
                <p>Tu evento está principalmente dirigido a:</p>
                <ul>
                    <li><input id="transfem" name="dirigido_transfem" type="checkbox" value="si"><label for="transfem"><span></span>Transfeminidades</label></li>
                    <li><input id="transmas" name="dirigido_transmas" type="checkbox" value="si"><label for="transmas"><span></span>Transmasculinidades</label></li>
                    <li><input id="NB" name="dirigido_nb" type="checkbox" value="si"><label for="NB"><span></span>No binarie</label></li>
                </ul>
            </section>

            <section id="SubirMultimedia">
                <h3>Sube tu material</h3>
                <label for="multimedia-principal">Ficha de evento principal *</label>
                <input type="file" id="multimedia-principal" name="archivo_principal" required>
                <label for="multimedia-zip">Archivo ZIP (si deseas subir más archivos)</label>
                <input type="file" id="multimedia-zip" name="archivo_zip" accept=".zip">
            </section>
        </fieldset>
            <button type="submit" class="boton-enviar">ENVIAR</button>
        </form>
    </div>
    
    <div id="retiro" class="seccion-formulario">
    <form action="https://usebasin.com/f/2de84737489c" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="_subject" value="[UnderTrans] Solicitud sobre imagen" />
        <fieldset>
            <section id="Retiro-Datos">
                <h3>Solicitud sobre tu imagen</h3>
 
                <label for="contacto-retiro">Correo o teléfono de contacto</label>
                <input type="text" id="contacto-retiro" name="contacto" placeholder="tucorreo@ejemplo.com o 55XXXXXXXX" required class="campo">
 
                <label for="referencia-foto">¿Cuál foto o evento es? (número, marcha o fecha aproximada)</label>
                <input type="text" id="referencia-foto" name="referencia_foto" placeholder="Ej. Foto 12, Visibilidad Trans 31 marzo 2026" required class="campo">
 
                <p>¿Qué necesitas?</p>
                <ul>
                    <li>
                        <input id="accion-retirar" name="accion_solicitada" type="radio" value="retirar" required>
                        <label for="accion-retirar"><span></span>Que retiren la imagen del archivo</label>
                    </li>
                    <li>
                        <input id="accion-enviar" name="accion_solicitada" type="radio" value="enviar" required>
                        <label for="accion-enviar"><span></span>Que me envíen la imagen</label>
                    </li>
                </ul>
 
                <label for="mensaje-retiro">Detalles adicionales</label>
                <textarea id="mensaje-retiro" name="mensaje" class="campo" placeholder="Cualquier información que ayude a identificar la imagen" required></textarea>
            </section>
        </fieldset>
        <button type="submit" class="boton-enviar">ENVIAR SOLICITUD</button>
    </form></div>
</body>
</html>
